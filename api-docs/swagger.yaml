basePath: /
definitions:
  bo.ResponseMode:
    enum:
    - redirect
    - proxy
    type: string
    x-enum-varnames:
    - ResponseModeRedirect
    - ResponseModeProxy
  model.ConversionStatus:
    enum:
    - success
    - failed
    - processing
    type: string
    x-enum-varnames:
    - ConversionStatusSuccess
    - ConversionStatusFailed
    - ConversionStatusProcessing
  model.ResponseMode:
    enum:
    - redirect
    - proxy
    type: string
    x-enum-varnames:
    - ResponseModeRedirect
    - ResponseModeProxy
  model.StoredFile:
    properties:
      created_at:
        description: CreatedAt 为创建时间。
        type: string
      file_name:
        description: FileName 为原始文件名。
        type: string
      file_size:
        description: FileSize 为文件大小（字节）。
        type: integer
      file_type:
        description: FileType 为文件 MIME 类型。
        type: string
      id:
        description: ID 为主键 ID。
        type: integer
      save_directory:
        description: SaveDirectory 为文件保存目录。
        type: string
      updated_at:
        description: UpdatedAt 为更新时间。
        type: string
    type: object
  request.BatchHideRequest:
    properties:
      response_mode:
        type: string
      urls:
        items:
          type: string
        type: array
    type: object
  request.BatchTextConvertRequest:
    properties:
      response_mode:
        type: string
      source_text:
        type: string
      sourceText:
        type: string
    type: object
  request.BatchTextUpdateResponseModeRequest:
    properties:
      response_mode:
        type: string
    required:
    - response_mode
    type: object
  request.ConvertSingleLinkRequest:
    properties:
      response_mode:
        type: string
      url:
        type: string
    required:
    - url
    type: object
  request.DocumentFileUpdateResponseModeRequest:
    properties:
      response_mode:
        type: string
    required:
    - response_mode
    type: object
  request.UpdateOriginalURLRequest:
    properties:
      original_url:
        type: string
    required:
    - original_url
    type: object
  request.UpdatePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  request.UpdateResponseModeRequest:
    properties:
      response_mode:
        type: string
    required:
    - response_mode
    type: object
  request.UpdateUsernameRequest:
    properties:
      username:
        type: string
    required:
    - username
    type: object
  response.BatchHideItemResponse:
    properties:
      code:
        type: string
      created:
        type: boolean
      fail_cause:
        type: string
      input_url:
        type: string
      response_mode:
        $ref: '#/definitions/bo.ResponseMode'
      short_url:
        type: string
    type: object
  response.BatchHideResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/response.BatchHideItemResponse'
        type: array
    type: object
  response.BatchTextConversionDetailResponse:
    properties:
      converted_text:
        description: ConvertedText 为转换后的文本内容。
        type: string
      created_at:
        description: CreatedAt 为创建时间。
        type: string
      download_url:
        type: string
      id:
        description: ID 为主键 ID。
        type: integer
      last_total_visit_count_at:
        description: LastTotalVisitCountAt 为上次统计总访问数量时间。
        type: string
      recognized_link_count:
        description: RecognizedLinkCount 为识别到的链接数量。
        type: integer
      response_mode:
        allOf:
        - $ref: '#/definitions/model.ResponseMode'
        description: ResponseMode 为转换生成链接的响应模式。
      source_text:
        description: SourceText 为原始文本内容。
        type: string
      status:
        allOf:
        - $ref: '#/definitions/model.ConversionStatus'
        description: Status 为当前转换状态。
      total_visit_count:
        description: TotalVisitCount 为关联链接的总访问数量。
        type: integer
      updated_at:
        description: UpdatedAt 为更新时间。
        type: string
    type: object
  response.BatchTextDetailResponse:
    properties:
      converted_text:
        type: string
      created_at:
        type: string
      id:
        type: integer
      recognized_link_count:
        type: integer
      response_mode:
        type: string
      source_text:
        type: string
      status:
        type: string
      total_visit_count:
        type: integer
      updated_at:
        type: string
    type: object
  response.BatchTextSubmitResponse:
    properties:
      conversion_id:
        type: integer
      conversion_record_count:
        type: integer
      message:
        type: string
      recognized_link_count:
        type: integer
      status:
        type: string
    type: object
  response.ConversionPageResponse:
    properties:
      has_next:
        type: boolean
      has_prev:
        type: boolean
      items:
        items:
          $ref: '#/definitions/response.ConversionRecordItemResponse'
        type: array
      next_page:
        type: integer
      page:
        type: integer
      prev_page:
        type: integer
      size:
        type: integer
      total:
        type: integer
    type: object
  response.ConversionRecordItemResponse:
    properties:
      batch_text:
        $ref: '#/definitions/response.BatchTextConversionDetailResponse'
      batch_text_conversion_id:
        description: BatchTextConversionID 为关联的批量转换表记录 ID，可为空。link_id、batch_text_conversion_id、uploaded_file_id 三者必须且只能有一个有值。
        type: integer
      conversion_type:
        type: string
      created_at:
        description: CreatedAt 为创建时间。
        type: string
      document_file:
        $ref: '#/definitions/response.DocumentFileConversionDetailResponse'
      id:
        description: ID 为主键 ID。
        type: integer
      link_id:
        description: LinkID 为关联的单链接转换记录 ID，可为空。link_id、batch_text_conversion_id、uploaded_file_id 三者必须且只能有一个有值。
        type: integer
      single_link:
        $ref: '#/definitions/response.SingleLinkConversionDetailResponse'
      updated_at:
        description: UpdatedAt 为更新时间。
        type: string
      uploaded_file_id:
        description: UploadedFileID 为关联的文档文件上传表记录 ID，可为空。link_id、batch_text_conversion_id、uploaded_file_id 三者必须且只能有一个有值。
        type: integer
    type: object
  response.DocumentFileConversionDetailResponse:
    properties:
      converted_file_id:
        description: ConvertedFileID 为转换后文件 ID。
        type: integer
      created_at:
        description: CreatedAt 为创建时间。
        type: string
      download_url:
        type: string
      file_id:
        description: FileID 为原始文件 ID。
        type: integer
      id:
        description: ID 为主键 ID。
        type: integer
      last_total_visit_count_at:
        description: LastTotalVisitCountAt 为上次统计总访问数量时间。
        type: string
      recognized_link_count:
        description: RecognizedLinkCount 为识别到的链接数量。
        type: integer
      response_mode:
        allOf:
        - $ref: '#/definitions/model.ResponseMode'
        description: ResponseMode 为转换生成链接的响应模式。
      status:
        allOf:
        - $ref: '#/definitions/model.ConversionStatus'
        description: Status 为当前转换状态。
      total_visit_count:
        description: TotalVisitCount 为关联链接的总访问数量。
        type: integer
      updated_at:
        description: UpdatedAt 为更新时间。
        type: string
      uploaded_file:
        $ref: '#/definitions/model.StoredFile'
    type: object
  response.DocumentFileSubmitResponse:
    properties:
      conversion_id:
        type: integer
      file_id:
        type: integer
      message:
        type: string
      status:
        type: string
    type: object
  response.DocumentFileUpdateResponseModeResponse:
    properties:
      conversion_id:
        type: integer
      message:
        type: string
      response_mode:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
      status:
        type: integer
      timestamp:
        type: string
    type: object
  response.LinkDetailResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      id:
        type: integer
      original_url:
        type: string
      response_mode:
        $ref: '#/definitions/bo.ResponseMode'
      updated_at:
        type: string
      visit_count:
        type: integer
    type: object
  response.LinkOriginalURLUpdateResponse:
    properties:
      code:
        type: string
      original_url:
        type: string
      updated_at:
        type: string
    type: object
  response.LinkResponseModeUpdateResponse:
    properties:
      code:
        type: string
      original_url:
        type: string
      response_mode:
        $ref: '#/definitions/bo.ResponseMode'
      updated_at:
        type: string
    type: object
  response.MessageResponse:
    properties:
      message:
        type: string
    type: object
  response.SingleLinkConversionDetailResponse:
    properties:
      batch_text_conversion_id:
        description: BatchTextConversionID 表示所属批量文本转换记录 ID，可为空。
        type: integer
      code:
        description: Code 为短链唯一码，需全局唯一。
        type: string
      created_at:
        description: CreatedAt 为创建时间。
        type: string
      document_file_conversion_id:
        description: DocumentFileConversionID 表示所属文档文件转换记录 ID，可为空。
        type: integer
      id:
        description: ID 为主键 ID。
        type: integer
      original_url:
        description: OriginalURL 为用户提交的原始链接。
        type: string
      response_mode:
        allOf:
        - $ref: '#/definitions/model.ResponseMode'
        description: ResponseMode 为短链访问时的响应模式。
      updated_at:
        description: UpdatedAt 为更新时间。
        type: string
      visit_count:
        description: VisitCount 为短链被访问的累计次数。
        type: integer
    type: object
  response.SingleLinkConvertResponse:
    properties:
      code:
        type: string
      conversion_record_id:
        type: integer
      created:
        type: boolean
      created_at:
        type: string
      original_url:
        type: string
      response_mode:
        $ref: '#/definitions/bo.ResponseMode'
      short_url:
        type: string
      updated_at:
        type: string
    type: object
  response.SystemExpiryResponse:
    properties:
      expiry_time_formatted:
        description: ExpiryTimeFormatted 过期时间的人类可读格式（RFC3339），永不过期时为空字符串。
        type: string
      expiry_timestamp:
        description: ExpiryTimestamp 配置的过期 Unix 时间戳（秒），为 0 表示永不过期。
        type: integer
      is_expired:
        description: IsExpired 是否已过期。
        type: boolean
      never_expires:
        description: NeverExpires 是否永不过期。
        type: boolean
      remaining_seconds:
        description: RemainingSeconds 剩余秒数；已过期或永不过期时为 0。
        type: integer
    type: object
  response.UpdatePasswordResponse:
    properties:
      message:
        type: string
    type: object
  response.UpdateUsernameResponse:
    properties:
      profile:
        $ref: '#/definitions/response.UserProfileResponse'
    type: object
  response.UserProfileResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      registered_days:
        type: integer
      total_links:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: Cloak 服务端 HTTP API 文档。
  title: Cloak Server API
  version: "1.0"
paths:
  /{code}:
    get:
      description: 访问短码，按响应模式返回重定向或代理内容。
      parameters:
      - description: 短码
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "301":
          description: Moved Permanently
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/response.MessageResponse'
      summary: 访问短链
      tags:
      - redirect
  /api/batch-text/{id}:
    delete:
      description: 删除指定批量文本转换任务及其关联数据，异步处理并返回 202。
      parameters:
      - description: 转换任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BasicAuth: []
      summary: 删除批量文本转换任务
      tags:
      - batch-text
    get:
      description: 根据任务 ID 获取批量文本转换详情。
      parameters:
      - description: 转换任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BatchTextDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BasicAuth: []
      summary: 查询批量文本转换详情
      tags:
      - batch-text
  /api/batch-text/{id}/download:
    get:
      description: 下载指定任务转换后的文本文件。
      parameters:
      - description: 转换任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - text/plain
      responses:
        "200":
          description: 转换后的文本内容
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BasicAuth: []
      summary: 下载批量文本转换结果
      tags:
      - batch-text
  /api/batch-text/{id}/response-mode:
    put:
      consumes:
      - application/json
      description: 切换指定批量文本任务下全部短链的响应模式，异步处理并返回 202。
      parameters:
      - description: 转换任务 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 切换响应模式请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.BatchTextUpdateResponseModeRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BasicAuth: []
      summary: 切换批量文本任务响应模式
      tags:
      - batch-text
  /api/batch-text/batch:
    post:
      consumes:
      - application/json
      description: 提交原始文本，后台识别并转换其中的链接。每个批量任务在 conversion_records 中仅保留一条聚合记录。
      parameters:
      - description: 批量文本转换请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.BatchTextConvertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BatchTextSubmitResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BasicAuth: []
      summary: 提交批量文本转换任务
      tags:
      - batch-text
  /api/conversions:
    get:
      description: 按页码和页大小分页查询历史转换记录。列表项根对象字段 id/link_id/batch_text_conversion_id/uploaded_file_id/created_at/updated_at 对应 conversion_records。link_id 允许为空，且 link_id、batch_text_conversion_id、uploaded_file_id 三者必须且只能有一个有值；single_link 详情仅在 conversion_type=single_link 时返回。
      parameters:
      - description: 页码（从 1 开始）
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ConversionPageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BasicAuth: []
      summary: 分页查询转换记录
      tags:
      - conversions
  /api/conversions/search:
    get:
      description: 根据关键字搜索转换记录，并分页返回结果。搜索范围包含单链接详情、批量文本任务关联短链、文档文件任务关联短链以及文档源文件名。字段语义与 /api/conversions 一致。
      parameters:
      - description: 搜索关键词
        in: query
        name: keyword
        type: string
      - description: 页码（从 1 开始）
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ConversionPageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BasicAuth: []
      summary: 搜索转换记录
      tags:
      - conversions
  /api/document-file/{id}:
    delete:
      description: 删除指定文档转换任务及其关联数据，异步处理并返回 202。
      parameters:
      - description: 转换任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BasicAuth: []
      summary: 删除文档转换任务
      tags:
      - document-file
  /api/document-file/{id}/download:
    get:
      description: 下载指定文档转换任务的结果文件。
      parameters:
      - description: 转换任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: 转换结果文件
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BasicAuth: []
      summary: 下载文档转换结果文件
      tags:
      - document-file
  /api/document-file/{id}/response-mode:
    put:
      consumes:
      - application/json
      description: 切换指定文档转换任务下全部短链的响应模式，异步处理并返回 202。
      parameters:
      - description: 转换任务 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 切换响应模式请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.DocumentFileUpdateResponseModeRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/response.DocumentFileUpdateResponseModeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BasicAuth: []
      summary: 切换文档任务响应模式
      tags:
      - document-file
  /api/document-file/batch:
    post:
      consumes:
      - multipart/form-data
      description: 上传文本文件并提交转换任务，最大 10MB。
      parameters:
      - description: 待转换文件
        in: formData
        name: file
        required: true
        type: file
